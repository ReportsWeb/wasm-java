server.port=${PORT:8080}
server.servlet.context-path=/
server.tomcat.threads.max=20
server.tomcat.max-connections=100
server.error.include-message=never
spring.datasource.url=${SPRING_DATASOURCE_URL:${REPORTS_DB_URL:jdbc:postgresql://database:5432/reports}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${REPORTS_DB_USER:reports}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${REPORTS_DB_PASSWORD:reports}}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
reports.resources=${REPORTS_RESOURCE_ROOT:/opt/reports/resources}
reports.engine-url=${REPORTS_ENGINE_URL:http://engine:3107}
reports.preview-url=${REPORTS_PREVIEW_URL:/demo/reports.web/preview/}
reports.designer-url=${REPORTS_DESIGNER_URL:/demo/reports.web/design/}
reports.asset-base=${REPORTS_PUBLIC_ASSET_BASE:/demo/reports.web/samples/java/api?action=asset&name=}
